apiVersion: v1
kind: Service

metadata:
  name: dpkvs-server-svc
  namespace: dpkvs
  labels:
    app: dpkvs-server

spec:
  type: LoadBalancer
  selector:
    app: dpkvs-server

  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP

---
apiVersion: v1
kind: Service

metadata:
  name: dpkvs-server-nodeport
  namespace: dpkvs
  labels:
    app: dpkvs-server

spec:
  type: NodePort
  selector:
    app: dpkvs-server

  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
    nodePort: 30051
